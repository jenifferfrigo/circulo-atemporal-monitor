name: Temporary five-hour Circulo API uptime check (27 Oct)

on:
  push:
    paths:
      - '.github/workflows/keepalive-2026-10-27-5h.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: circulo-temporary-keepalive-2026-10-27
  cancel-in-progress: false

jobs:
  temporary-health:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 315
    steps:
      - name: Check Circulo health periodically until 16:52 BRT on October 27
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone

          endpoint = "https://circulo-atemporal-api.onrender.com/health"
          deadline = datetime.fromisoformat("2026-10-27T19:52:28+00:00")
          print("Temporary monitor started. Deadline 2026-10-27 16:52:28 Brazil time.", flush=True)
          failures = 0
          checks = 0
          while datetime.now(timezone.utc) < deadline:
              checks += 1
              passed = False
              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(
                          endpoint,
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "Circulo-Temporary-Health-20261027",
                          },
                      )
                      with urllib.request.urlopen(request, timeout=55) as response:
                          payload = response.read(2049)
                          if response.status != 200 or len(payload) > 2048:
                              raise RuntimeError("Unexpected HTTP response")
                      data = json.loads(payload)
                      if data.get("status") != "ok" or data.get("service") != "circulo-atemporal-backend":
                          raise RuntimeError("Unexpected health payload")
                      passed = True
                      print(f"Check {checks}: API healthy ({datetime.now(timezone.utc).isoformat()})", flush=True)
                      break
                  except Exception as exc:
                      print(f"Check {checks}, attempt {attempt}: {type(exc).__name__}", flush=True)
                      if attempt < 3 and datetime.now(timezone.utc) < deadline:
                          time.sleep(5)
              if not passed:
                  failures += 1
                  print(f"Check {checks}: API was unavailable; monitoring continues", flush=True)
              seconds_left = (deadline - datetime.now(timezone.utc)).total_seconds()
              if seconds_left <= 0:
                  break
              time.sleep(min(300, seconds_left))
          print(f"Temporary five-hour monitor ended. checks={checks} failed_checks={failures}", flush=True)
          if checks and failures == checks:
              raise SystemExit("Every health check failed")
          PY
