name: Daytime Circulo API health

on:
  schedule:
    # UTC 11:06-00:56 = Sao Paulo 08:06-21:56, approximately every 5 minutes.
    # Best-effort: GitHub schedules can be delayed or dropped.
    - cron: '6-56/5 0,11-23 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: circulo-api-health
  cancel-in-progress: false

jobs:
  health:
    # Standard runners are free for public repositories. Never run privately.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public API health during Sao Paulo daytime
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          import time
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          current = datetime.now(ZoneInfo('America/Sao_Paulo'))
          print(f'Health monitor executed at {current.isoformat()}')
          if not 8 <= current.hour < 22:
              print('Outside the 08:00-22:00 Sao Paulo window; no request sent.')
              sys.exit(0)

          endpoint = 'https://circulo-atemporal-api.onrender.com/health'
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(endpoint, headers={
                      'Accept': 'application/json',
                      'User-Agent': 'Circulo-Daytime-Health-Monitor/1.0',
                  })
                  with urllib.request.urlopen(request, timeout=40) as response:
                      payload = response.read(2049)
                      if response.status != 200 or len(payload) > 2048:
                          raise ValueError('Unexpected health response')
                  data = json.loads(payload)
                  if data.get('status') != 'ok' or data.get('service') != 'circulo-atemporal-backend':
                      raise ValueError('Unexpected service identity')
                  print(f'Circulo API health passed at {datetime.now(ZoneInfo("America/Sao_Paulo")).isoformat()}; only GET /health was called.')
                  sys.exit(0)
              except Exception as error:
                  print(f'Health attempt {attempt}/3 failed ({type(error).__name__}).')
                  if attempt < 3:
                      time.sleep(5)
          sys.exit(1)
          PY
